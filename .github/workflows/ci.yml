name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check-nginx-routes

  infra-test:
    name: Infra tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/tests/piston-cloudinit.test.sh

  build:
    name: TypeScript + build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BACKEND_INTERNAL_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  integration:
    name: Integration tests (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm run setup
      - name: Set Puppeteer Chrome path
        run: |
          CHROME=$(which google-chrome-stable 2>/dev/null || which google-chrome 2>/dev/null || which chromium-browser 2>/dev/null || which chromium 2>/dev/null || echo "")
          if [ -n "$CHROME" ]; then
            echo "Using system Chrome: $CHROME"
            echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> $GITHUB_ENV
          else
            echo "System Chrome not found, installing via puppeteer"
            rm -rf ~/.cache/puppeteer
            node node_modules/.bin/puppeteer browsers install chrome
          fi
      - name: Create .env.production
        run: |
          echo "NODE_ENV=production" >> .env.production
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env.production
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.production
          echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}" >> .env.production
          echo "CLIENT_URL=${{ secrets.CLIENT_URL }}" >> .env.production
          echo "CLOUDINARY_NAME=${{ secrets.CLOUDINARY_NAME }}" >> .env.production
          echo "CLOUDINARY_KEY=${{ secrets.CLOUDINARY_KEY }}" >> .env.production
          echo "CLOUDINARY_SECRET=${{ secrets.CLOUDINARY_SECRET }}" >> .env.production
          echo "CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}" >> .env.production
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env.production
          echo "PISTON_URL=${{ secrets.PISTON_URL }}" >> .env.production
          echo "PISTON_TOKEN=${{ secrets.PISTON_TOKEN }}" >> .env.production
          printf 'PISTON_CA_CERT="%s"\n' "${{ secrets.PISTON_CA_CERT }}" >> .env.production
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .env.production
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .env.production
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .env.production
          echo "R2_BUCKET=${{ secrets.R2_BUCKET }}" >> .env.production
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> .env.production
          echo "TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}" >> .env.production
          echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .env.production
          echo "HOSTED_STORAGE_LIMIT_BYTES=${{ secrets.HOSTED_STORAGE_LIMIT_BYTES }}" >> .env.production
      - name: Run integration tests
        run: npm run test:prod

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # One deploy at a time. Container Apps rejects an update while another is still
    # provisioning, so merges that landed close together failed each other, and the one that
    # finished last went live even when it was an older commit. A newer push waiting here
    # replaces an older one that hasn't started yet, so the latest commit is what deploys.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # docker login with the OIDC identity from azure/login (AcrPush), no admin credentials
      - name: Log in to ACR
        run: az acr login --name adorioacr
      # pinned to a commit SHA, not a tag. This job gets an Azure OIDC token and a
      # build-arg secret, so a hijacked upstream tag would run with that access.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # built here instead of `az acr build` because ACR Tasks has no layer cache.
      # The gha cache keeps layers between runs, so a push with no dependency
      # changes reuses the npm install and build layers.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: adorioacr.azurecr.io/adorio:${{ github.sha }}
          build-args: |
            VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy new revision
        run: |
          az containerapp update --name adorio --resource-group adorio-prod-rg \
            --image adorioacr.azurecr.io/adorio:${{ github.sha }}
      - name: Verify deployment health
        run: node scripts/wait-for-url.cjs https://adorio.orangeground-7d1e6e2f.southeastasia.azurecontainerapps.io/api/health 180000 2000
      # prerendered pages like / are sent with s-maxage=31536000, so Cloudflare keeps
      # them for a year. Each deploy replaces the hashed chunks in _next/static/, so
      # old cached HTML 404s on every asset and never hydrates. Purging fixes that.
      - name: Purge Cloudflare cache
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
