events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream nextjs {
    server localhost:3001;
    keepalive 32;
  }

  upstream backend {
    server localhost:3000;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name adorio.space www.adorio.space;

    absolute_redirect off;
    port_in_redirect off;

    # Next.js route handlers. Exact matches beat the /api/ prefix below no matter
    # the order, so these go to Next.js instead of Express
    location = /api/contact {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/github-activity {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cao/ {
      alias /usr/share/nginx/html/cao/;
      try_files $uri $uri/ /cao/index.html;
    }
    location = /cao {
      return 301 https://adorio.space/cao/;
    }

    # hashed and immutable, so buffering is fine here
    location /_next/static/ {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_buffering on;
    }

    # buffering has to stay off or Suspense streaming breaks.
    # This won't do a real WebSocket upgrade: Connection '' is always empty, and
    # RFC 7230 6.7 wants Connection: upgrade when $http_upgrade is set. It'd need
    # the map $http_upgrade $connection_upgrade pattern. Nothing uses WS yet.
    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
