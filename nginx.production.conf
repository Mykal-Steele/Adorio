events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream nextjs {
    server localhost:3001;
    keepalive 32;
  }

  upstream backend {
    server localhost:3000;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name adorio.space www.adorio.space;

    absolute_redirect off;
    port_in_redirect off;

    # Next.js Route Handlers under /api/ — exact matches always win over the
    # prefix match below regardless of order, so these reach Next.js instead
    # of falling through to Express
    location = /api/contact {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/github-activity {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Express API
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI-Slop static
    location /cao/ {
      alias /usr/share/nginx/html/cao/;
      try_files $uri $uri/ /cao/index.html;
    }
    location = /cao {
      return 301 https://adorio.space/cao/;
    }

    # Next.js static assets — long cache, can be buffered
    location /_next/static/ {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_buffering on;
    }

    # Everything else → Next.js SSR
    # proxy_buffering off is CRITICAL for Suspense streaming to work
    # Upgrade/Connection here predate this refactor and are left as-is: note
    # that Connection '' is unconditional, so this does NOT correctly complete
    # a real WebSocket upgrade (RFC 7230 §6.7 needs Connection: upgrade, not
    # empty, when $http_upgrade is set) — that would need the standard
    # map $http_upgrade $connection_upgrade pattern instead. Not fixing that
    # here since nothing currently depends on it; flagging so it isn't
    # mistaken for working WS support later.
    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
